name: build lozhka

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: generate platform files
        run: flutter create --project-name lozhka --org com.lozhka --platforms android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lozhka-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: generate platform files
        run: flutter create --project-name lozhka --org com.lozhka --platforms windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: lozhka-windows
          path: build/windows/x64/runner/Release/

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: generate platform files
        run: flutter create --project-name lozhka --org com.lozhka --platforms ios .
      - name: build ios (simulator)
        run: flutter build ios --release --simulator
      - uses: actions/upload-artifact@v4
        with:
          name: lozhka-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
